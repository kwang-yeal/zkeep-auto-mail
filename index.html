    .btn-secondary { width:100%; padding:12px; background:#fff; color:#ED5C43; border:1.5px solid #ED5C43; border-radius:10px; font-size:14px; font-weight:600; cursor:pointer; margin-top:10px; transition:background 0.2s; font-family:inherit; }

var EMAIL_TEMPLATE = decodeURIComponent(escape(atob(_tpl)));

emailjs.init(EJ_PUBLIC);

function getValues() {
  return {
    company: document.getElementById("company").value.trim(),
    name: document.getElementById("name").value.trim(),
    email: document.getElementById("email").value.trim()
  };
}

function getFilledTemplate(company, name) {
  return EMAIL_TEMPLATE
    .replace(/\{\{company\}\}/g, company || "(회사명)")
    .replace(/\{\{name\}\}/g, name || "(성함)");
}

function openPreview() {
  var v = getValues();
  document.getElementById("previewContainer").innerHTML = getFilledTemplate(v.company, v.name);
  document.getElementById("previewModal").style.display = "flex";
  document.body.style.overflow = "hidden";
}

function closePreview() {
  document.getElementById("previewModal").style.display = "none";
  document.getElementById("previewContainer").innerHTML = "";
  document.body.style.overflow = "";
}

function showStatus(type, msg) {
  var el = document.getElementById("status");
  el.className = "status " + type;
  el.textContent = msg;
}

function sendMail() {
  var v = getValues();
  if (!v.company || !v.name || !v.email) {
    showStatus("error", "회사명, 성함, 이메일을 모두 입력해주세요.");
    return;
  }
  var btn = document.querySelector(".btn-primary");
  btn.disabled = true;
  showStatus("loading", "발송 중입니다...");
  emailjs.send(EJ_SERVICE, EJ_TEMPLATE, {
    to_email: v.email,
    to_name: v.name + " 대표님",
    company: v.company,
    subject: "[마이스터] 지킴E 프로그램 사용 및 초기 세팅 안내",
    html_content: getFilledTemplate(v.company, v.name)
  }).then(function() {
    showStatus("success", v.company + " " + v.name + " 대표님께 메일을 발송했습니다!");
    addHistory(v.company, v.name, v.email);
    document.getElementById("company").value = "";
    document.getElementById("name").value = "";
    document.getElementById("email").value = "";
    btn.disabled = false;
  }, function(err) {
    showStatus("error", "발송 실패: " + (err.text || JSON.stringify(err)));
    btn.disabled = false;
  });
}

function addHistory(company, name, email) {
  var h = JSON.parse(localStorage.getItem("zkeep_history") || "[]");
  h.unshift({company:company, name:name, email:email, time:new Date().toLocaleString("ko-KR")});
  if (h.length > 20) h.pop();
  localStorage.setItem("zkeep_history", JSON.stringify(h));
  renderHistory();
}

function renderHistory() {
  var h = JSON.parse(localStorage.getItem("zkeep_history") || "[]");
  if (!h.length) return;
  document.getElementById("historySection").style.display = "block";
  document.getElementById("historyList").innerHTML = h.map(function(x) {
    return "<div class=\"history-item\"><span>" + x.time + " · " + x.company + " " + x.name + "</span><span class=\"sent-badge\">발송완료</span></div>";
  }).join("");
}

renderHistory();
</script>
