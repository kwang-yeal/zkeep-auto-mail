<script>
const EJ_PUBLIC   = 'j3JdosvV4IsWAhQvO';
const EJ_SERVICE  = 'myster-guide';
const EJ_TEMPLATE = 'myster-edu1';

const EMAIL_TEMPLATE = JSON.parse(document.getElementById('emailTpl').textContent);

window.onload = function() {
  emailjs.init(EJ_PUBLIC);
  renderHistory();
};

function getValues() {
  return {
    company : document.getElementById('company').value.trim(),
    name    : document.getElementById('name').value.trim(),
    email   : document.getElementById('email').value.trim(),
  };
}

function validate() {
  const { company, name, email } = getValues();
  if (!company || !name || !email) {
    showStatus('error', '❌ 회사명, 성함, 이메일을 모두 입력해주세요.');
    return false;
  }
  return true;
}

function getFilledTemplate(company, name) {
  return EMAIL_TEMPLATE
    .replace(/{{company}}/g, company)
    .replace(/{{name}}/g, name);
}

function openPreview() {
  const company = document.getElementById('company').value.trim() || '(회사명)';
  const name    = document.getElementById('name').value.trim() || '(성함)';
  const html = getFilledTemplate(company, name);
  const modal = document.getElementById('previewModal');
  const container = document.getElementById('previewContainer');
  container.innerHTML = html;
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closePreview() {
  document.getElementById('previewModal').style.display = 'none';
  document.getElementById('previewContainer').innerHTML = '';
  document.body.style.overflow = '';
}

async function sendMail() {
  if (!validate()) return;
  const { company, name, email } = getValues();
  const btn = document.querySelector('.btn-primary');
  btn.disabled = true;
  showStatus('loading', '📨 발송 중입니다...');

  try {
    await emailjs.send(EJ_SERVICE, EJ_TEMPLATE, {
      to_email     : email,
      to_name      : name + ' 대표님',
      company      : company,
      subject      : '[마이스터] 지킴E 프로그램 사용 및 초기 세팅 안내',
      html_content : getFilledTemplate(company, name),
    });
    showStatus('success', '✅ ' + company + ' ' + name + ' 대표님께 메일을 발송했습니다!');
    addHistory(company, name, email);
    document.getElementById('company').value = '';
    document.getElementById('name').value = '';
    document.getElementById('email').value = '';
  } catch(err) {
    showStatus('error', '❌ 발송 실패: ' + (err.text || JSON.stringify(err)));
  }
  btn.disabled = false;
}

function showStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.textContent = msg;
}

function addHistory(company, name, email) {
  const history = JSON.parse(localStorage.getItem('zkeep_history') || '[]');
  history.unshift({ company, name, email, time: new Date().toLocaleString('ko-KR') });
  if (history.length > 20) history.pop();
  localStorage.setItem('zkeep_history', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const history = JSON.parse(localStorage.getItem('zkeep_history') || '[]');
  if (!history.length) return;
  document.getElementById('historySection').style.display = 'block';
  document.getElementById('historyList').inner
