<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>지킴E 안내 메일 발송</title>
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', Arial, sans-serif;
      background: #f5f6f8;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      padding: 40px;
      width: 100%;
      max-width: 520px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .logo-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 2px solid #ED5C43;
    }
    .logo-row img { width: 100px; height: auto; }
    .logo-row span { font-size: 13px; color: #9ca3af; }
    h1 { font-size: 20px; font-weight: 700; color: #111827; margin-bottom: 6px; }
    .subtitle { font-size: 13px; color: #6b7280; margin-bottom: 28px; line-height: 1.7; }
    label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      font-size: 14px;
      color: #111827;
      margin-bottom: 16px;
      outline: none;
      transition: border 0.2s;
      font-family: inherit;
      background: #fff;
    }
    input:focus { border-color: #ED5C43; box-shadow: 0 0 0 3px rgba(237,92,67,0.1); }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: #ED5C43;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn-primary:hover { background: #d94e37; }
    .btn-primary:disabled { background: #e5e7eb; color: #9ca3af; cursor: not-allowed; }
    .btn-secondary {
      width: 100%;
      padding: 12px;
      background: #fff;
      color: #ED5C43;
      border: 1.5px solid #ED5C43;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
      font-family: inherit;
    }
    .btn-secondary:hover { background: #fff8f7; }
    .divider { height: 1px; background: #f0f0f0; margin: 24px 0; }
    .status {
      margin-top: 14px;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      text-align: center;
      display: none;
      line-height: 1.6;
    }
    .status.success { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; display: block; }
    .status.error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; display: block; }
    .status.loading { background: #fff8f7; color: #ED5C43; border: 1px solid #fcd5cc; display: block; }
    .history-section { margin-top: 28px; }
    .history-title { font-size: 13px; font-weight: 700; color: #374151; margin-bottom: 10px; }
    .history-item {
      font-size: 12px; color: #6b7280;
      padding: 8px 12px; background: #f9fafb;
      border-radius: 6px; margin-bottom: 6px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .sent-badge { color: #10b981; font-weight: 600; font-size: 11px; }
  </style>
</head>

window.onload = function() {
  emailjs.init(EJ_PUBLIC);
  renderHistory();
};

function getValues() {
  return {
    company : document.getElementById('company').value.trim(),
    name    : document.getElementById('name').value.trim(),
    email   : document.getElementById('email').value.trim(),
  };
}

function validate() {
  const { company, name, email } = getValues();
  if (!company || !name || !email) {
    showStatus('error', '❌ 회사명, 성함, 이메일을 모두 입력해주세요.');
    return false;
  }
  return true;
}

function getFilledTemplate(company, name) {
  return EMAIL_TEMPLATE
    .replace(/{{company}}/g, company)
    .replace(/{{name}}/g, name);
}

function openPreview() {
  if (!validate()) return;
  const { company, name } = getValues();
  const win = window.open('', '_blank');
  win.document.write(getFilledTemplate(company, name));
  win.document.close();
}

async function sendMail() {
  if (!validate()) return;
  const { company, name, email } = getValues();
  const btn = document.querySelector('.btn-primary');
  btn.disabled = true;
  showStatus('loading', '📨 발송 중입니다...');

  try {
    await emailjs.send(EJ_SERVICE, EJ_TEMPLATE, {
      to_email     : email,
      to_name      : name + ' 대표님',
      company      : company,
      subject      : '[마이스터] 지킴E 프로그램 사용 및 초기 세팅 안내',
      html_content : getFilledTemplate(company, name),
    });
    showStatus('success', '✅ ' + company + ' ' + name + ' 대표님께 메일을 발송했습니다!');
    addHistory(company, name, email);
    document.getElementById('company').value = '';
    document.getElementById('name').value = '';
    document.getElementById('email').value = '';
  } catch(err) {
    showStatus('error', '❌ 발송 실패: ' + (err.text || JSON.stringify(err)));
  }
  btn.disabled = false;
}

function showStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.textContent = msg;
}

function addHistory(company, name, email) {
  const history = JSON.parse(localStorage.getItem('zkeep_history') || '[]');
  history.unshift({ company, name, email, time: new Date().toLocaleString('ko-KR') });
  if (history.length > 20) history.pop();
  localStorage.setItem('zkeep_history', JSON.stringify(history));
  renderHistory();
}

function renderHistory() {
  const history = JSON.parse(localStorage.getItem('zkeep_history') || '[]');
  if (!history.length) return;
  document.getElementById('historySection').style.display = 'block';
  document.getElementById('historyList').innerHTML = history.map(h =>
    `<div class="history-item">
      <span>${h.time} &nbsp;·&nbsp; ${h.company} ${h.name}</span>
      <span class="sent-badge">✓ 발송완료</span>
    </div>`
  ).join('');
}
</script>
